services:
  - type: web
    name: homs-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter
    # Run migrations only through the approved release process.
    # For an existing database, review and run manage.py migrate before release.
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      # Demo login is required by the demo instance: /auth/demo-login/ is
      # strictly limited to accounts seeded & flagged is_demo by
      # `manage.py seed_demo` and can never reach regular accounts.
      - key: DEMO_LOGIN
        value: "true"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: demo-jpuo.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://frontend-lake-three-pu8rw4cxw9.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:3000,http://127.0.0.1:3000,https://frontend-lake-three-pu8rw4cxw9.vercel.app
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "false"
      - key: CORS_ALLOW_CREDENTIALS
        value: "true"
      - key: FRONTEND_BASE_URL
        value: https://frontend-lake-three-pu8rw4cxw9.vercel.app
      - key: PUBLIC_API_BASE_URL
        value: https://demo-jpuo.onrender.com/api/v1
      - key: DATABASE_URL
        sync: false
      - key: DB_CONN_MAX_AGE
        value: "60"
      - key: DJANGO_LOG_LEVEL
        value: INFO
      - key: GUNICORN_WORKERS
        value: "3"
      - key: GUNICORN_TIMEOUT
        value: "120"
      - key: RUN_MIGRATIONS
        value: "0"
      - key: DJANGO_MEDIA_ROOT
        value: /app/media
    disk:
      name: media
      mountPath: /app/media
      sizeGB: 1
    healthCheckPath: /api/v1/health/
    autoDeploy: true
