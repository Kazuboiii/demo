name: uems_mobile
description: "UEMS staff mobile app — attendance QR scanner, inventory barcode scanner, driver trips."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP client for the Django REST API
  http: ^1.3.0

  # Camera-based QR / barcode scanning
  mobile_scanner: ^5.1.0

  # Secure on-device credential storage
  flutter_secure_storage: ^9.2.2

  # Lightweight state management + local config (API base URL)
  provider: ^6.1.2
  shared_preferences: ^2.3.2

  # Date/time formatting (Kathmandu tz display)
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
